name: Release

# The installer version comes from installer/anchor.iss (#define MyAppVersion)
# and drives OutputBaseFilename (Anchor-<version>-setup.exe). Keep MyAppVersion
# in step with the pushed git tag and the csproj <Version>.
#
# Releases are immutable (repository setting): once published, the release
# assets and the tag are locked. To fix a bad release, ship a new version.
#
# Each installer gets a signed build provenance attestation. Verify a download
# with: gh attestation verify Anchor-<version>-setup.exe -R Telesphoreo/Anchor
#
# A tag push builds and publishes a release. A manual run (workflow_dispatch)
# builds and attests the installer but only uploads it as a workflow artifact.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Grant nothing by default; the job requests what it needs.
permissions: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the provenance attestation (Sigstore)
      attestations: write  # store the attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup 6
        run: choco install innosetup --version=6.7.1 -y

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $iss = Get-Content installer/anchor.iss -Raw
          if ($iss -notmatch '#define\s+MyAppVersion\s+"([^"]+)"') {
            throw 'Could not find MyAppVersion in installer/anchor.iss.'
          }

          $version = $Matches[1]
          $tag = "v$version"

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Pushed tag '$env:GITHUB_REF_NAME' does not match installer version '$tag'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=Anchor $version" >> $env:GITHUB_OUTPUT

      - name: Publish and compile installer
        run: pwsh -File scripts/build-installer.ps1

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem artifacts/installer/*.exe | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $lines | Set-Content artifacts/installer/SHA256SUMS.txt
          Get-Content artifacts/installer/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/installer/*.exe

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          $assets = @(Get-ChildItem artifacts/installer/*.exe | ForEach-Object FullName)
          $assets += (Resolve-Path artifacts/installer/SHA256SUMS.txt).Path
          gh release create $env:TAG @assets --title $env:NAME --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }

      - name: Upload installer as workflow artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ steps.version.outputs.version }}
          path: |
            artifacts/installer/*.exe
            artifacts/installer/SHA256SUMS.txt
